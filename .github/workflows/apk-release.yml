name: Android Release Build (Signed)

# FIX: এই workflow টা repo secrets এ রাখা keystore ব্যবহার করে একটা সাইনড
# (signed) রিলিজ APK বানায় এবং GitHub Release এ আপলোড করে। এটা কাজ করার আগে
# অবশ্যই নিচের ৪টা repository secret বসাতে হবে (Settings → Secrets and
# variables → Actions):
#   - KEYSTORE_BASE64
#   - KEY_ALIAS
#   - KEYSTORE_PASSWORD
#   - KEY_PASSWORD
# (এই মানগুলো generate-keystore.yml workflow রান করে পাওয়া যায়।)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # FIX: আপনার build.gradle.kts এর AGP ভার্সনের সাথে মিলিয়ে এই Gradle
      # ভার্সনটা রাখুন — AGP 8.13.x হলে '8.13' ঠিক আছে, AGP 9.x এ গেলে
      # '9.7.0' ব্যবহার করুন।
      - name: Setup Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.7.0'

      - name: Verify Gradle Version
        run: gradle --version

      - name: Decode Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          ls -lh release.jks

      - name: Build Unsigned Release APK
        run: gradle assembleRelease

      - name: Locate Unsigned APK
        id: find_apk
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          echo "unsigned_apk=$UNSIGNED_APK" >> "$GITHUB_OUTPUT"
          ls -lh app/build/outputs/apk/release/

      - name: Zipalign + Sign APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          # সবচেয়ে নতুন ইনস্টল করা Android build-tools ভার্সন খুঁজে বের করা হচ্ছে
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          ZIPALIGN="${BUILD_TOOLS_DIR}zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}apksigner"

          UNSIGNED_APK="${{ steps.find_apk.outputs.unsigned_apk }}"

          "$ZIPALIGN" -v 4 "$UNSIGNED_APK" app-release-aligned.apk

          "$APKSIGNER" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app-release-signed.apk \
            app-release-aligned.apk

          "$APKSIGNER" verify app-release-signed.apk

      - name: Verify Signed APK
        run: |
          ls -lh app-release-signed.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release-signed.apk
          tag_name: release-${{ github.run_number }}
          name: SunnyCare App v${{ github.run_number }} (Signed Release)
          body: |
            Signed Android Release APK.

            Download: app-release-signed.apk

            এটা এখন Play Store এ আপলোডযোগ্য একটা সাইনড রিলিজ বিল্ড।
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
