name: Generate Release Keystore

# FIX: এটা একবার চালানোর জন্য একটা ইউটিলিটি workflow — এটা একটা নতুন Android
# release keystore (.jks) তৈরি করে, তার base64 ভার্সন বানায়, এবং র‍্যান্ডম
# সুরক্ষিত পাসওয়ার্ড জেনারেট করে। ফলাফল artifact হিসেবে ডাউনলোডযোগ্য থাকে
# (retention-days: 1 — মাত্র ১ দিন পর নিজে থেকেই মুছে যাবে, নিরাপত্তার জন্য)।
#
# গুরুত্বপূর্ণ: এই workflow রান করার পর অবশ্যই দ্রুত আপনার repository Settings →
# Secrets and variables → Actions এ গিয়ে ৪টা secret বসিয়ে নিন
# (KEYSTORE_BASE64, KEY_ALIAS, KEYSTORE_PASSWORD, KEY_PASSWORD), তারপর এই
# workflow run/artifact মুছে ফেলুন। রিপো পাবলিক হলে আরও সতর্ক থাকুন — ততক্ষণ
# পর্যন্ত এই artifact যে কেউ দেখতে পারবে যতক্ষণ না মোছা হয়।

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Generate Keystore + Random Passwords
        run: |
          set -e

          KEY_ALIAS="sunnycare_release"
          KEYSTORE_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)

          # লগে ভুলবশত পাসওয়ার্ড প্রিন্ট হয়ে গেলেও GitHub সেটা *** দিয়ে মাস্ক করে দেবে
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          keytool -genkeypair -v \
            -keystore release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=SunnyCare, OU=KonaSL, O=KonaSL, L=Dhaka, ST=Dhaka, C=BD"

          base64 -w 0 release.jks > release_keystore_base64.txt

          {
            echo "===================================================="
            echo " SunnyCare Release Keystore — তথ্য (গোপন রাখুন)"
            echo "===================================================="
            echo ""
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo ""
            echo "KEYSTORE_BASE64 এর মান release_keystore_base64.txt ফাইলে আছে।"
            echo "সেই ফাইলের পুরো কনটেন্ট (কোনো স্পেস/নিউলাইন যোগ না করে) কপি করে"
            echo "GitHub repo secret 'KEYSTORE_BASE64' এ বসান।"
            echo ""
            echo "এই ৪টা মান (KEYSTORE_BASE64, KEY_ALIAS, KEYSTORE_PASSWORD,"
            echo "KEY_PASSWORD) repo Settings > Secrets and variables > Actions"
            echo "এ ৪টা আলাদা secret হিসেবে বসাতে হবে।"
            echo "===================================================="
          } > keystore-info.txt

          echo "keystore-info.txt তৈরি হয়েছে (কনসোলে দেখানো হচ্ছে না, ডাউনলোড করে দেখুন)"

      - name: Upload Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.jks
            release_keystore_base64.txt
            keystore-info.txt
          retention-days: 1
