name: Android APK

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'নতুন Package Name লিখুন'
        required: true
        default: 'com.example.nagad'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
      - name: Update Package Name
        run: |
          NEW_PACKAGE="${{ inputs.package_name }}"
          if [ -f app/build.gradle ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$NEW_PACKAGE\"/" app/build.gradle
            sed -i "s/namespace '.*'/namespace '$NEW_PACKAGE'/" app/build.gradle
            sed -i "s/namespace \".*\"/namespace \"$NEW_PACKAGE\"/" app/build.gradle
          fi
          if [ -f app/build.gradle.kts ]; then
            sed -i "s/applicationId = \".*\"/applicationId = \"$NEW_PACKAGE\"/" app/build.gradle.kts
            sed -i "s/namespace = \".*\"/namespace = \"$NEW_PACKAGE\"/" app/build.gradle.kts
          fi
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${{ inputs.package_name }}-debug.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/${{ inputs.package_name }}-debug.apk
          tag_name: build-${{ github.run_number }}
          name: Nagad App v${{ github.run_number }} - ${{ inputs.package_name }}
          body: "Package: ${{ inputs.package_name }} | Assets থেকে APK ডাউনলোড করুন"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
