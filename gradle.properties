# মেমোরি বাড়ানো হচ্ছে (এটি আপনার এরর সমাধান করবে)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# আগের সেটিংসগুলো ঠিক রাখুন
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36

# FIX: AGP 9.0+ এ Kotlin সাপোর্ট এখন বিল্ট-ইন এবং ডিফল্টভাবে চালু থাকে, যা
# app/build.gradle.kts এ আলাদা করে অ্যাপ্লাই করা 'org.jetbrains.kotlin.android'
# প্লাগইনের সাথে কনফ্লিক্ট করে (এরর: "Failed to apply plugin
# 'org.jetbrains.kotlin.android'... The plugin is no longer required since
# AGP 9.0")। এই লাইনটা built-in Kotlin সাময়িকভাবে বন্ধ রেখে পুরনো
# kotlin-android প্লাগইন প্যাটার্ন ব্যবহার করতে দেয়, তাই app/build.gradle.kts
# এ কোনো পরিবর্তন ছাড়াই বিল্ড আবার চলবে।
#
# মনে রাখবেন: AGP 10.0 এ গেলে এই সেটিং আর কাজ করবে না, তখন
# 'org.jetbrains.kotlin.android' প্লাগইন সম্পূর্ণ সরিয়ে built-in Kotlin এ
# মাইগ্রেট করতেই হবে (তখন প্রয়োজনে জানাবেন, app/build.gradle.kts আপডেট করে দেব)।
android.builtInKotlin=false

# FIX: শুধু builtInKotlin বন্ধ করলেই যথেষ্ট নয় — AGP 9 এ ডিফল্টভাবে চালু থাকা
# নতুন Variant/Extension DSL ("new DSL") এর সাথে পুরনো 'org.jetbrains.kotlin.android'
# প্লাগইন সম্পূর্ণ কম্প্যাটিবল না, যার ফলে এই এরর আসে:
# "class ...ApplicationExtensionImpl$AgpDecorated_Decorated cannot be cast to
#  class com.android.build.gradle.BaseExtension"
# এই লাইনটা new DSL ও সাময়িকভাবে বন্ধ রাখে, যাতে kotlin-android প্লাগইন আগের
# মতোই স্বাভাবিকভাবে কাজ করে। এটাও একটা সাময়িক সেটিং — AGP 10.0 এ built-in
# Kotlin এ পুরোপুরি মাইগ্রেট করলে এই দুটো লাইনই বাদ দেওয়া যাবে।
android.newDsl=false
